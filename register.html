<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register page</title>

<link rel="stylesheet" href="css/register.css">


</head>
<body>

<form action="">

    <legend>Join us Today!</legend>
    <br>

<label for="full name">Full Name</label>
<input type="text" id="full name" placeholder="e.g Peter Gelly" required>
<br><br>


<label for="email">Email Address:</label>
<input type="email" id="email" placeholder="e.g abg@gmail.com">
<br><br>

<label for="pwd">Enter your password</label>
<input type="password" id="pwd" placeholder="Type your password">
<br><br>

<label for="phone">Phone Number</label>
<input type="tel" id="phone" placeholder="0707277112">
<br><br>

<label for="dob">Birthday</label>
<input type="date" id="dob" required>
<br><br>

<label for="dt">Date and Time</label>
<input type="date-time local" id="dt" required>
<br><br>

<label for="upload"Upload File></label>
<input type="file" id="uploader" required>
<br><br>

<button>Register</button>


</form>























    
</body>
</html>
